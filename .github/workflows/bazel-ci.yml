name: Bazel CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test with Bazel
    runs-on: macos-26  # macOS 26 with Xcode 26 for FoundationModels support
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    

    
    - name: Install Bazelisk
      run: |
        brew install bazelisk
        bazelisk version
    
    - name: Cache Bazel artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/Library/Caches/bazel
        key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelrc', '**/BUILD.bazel') }}
        restore-keys: |
          bazel-${{ runner.os }}-
    
    - name: Build main app
      run: |
        cd "Poem of the Day"
        bazelisk build //:PoemOfTheDay
    
    - name: Build widget extension
      run: |
        cd "Poem of the Day"
        bazelisk build //Poem\ of\ the\ Day\ Widget:PoemOfTheDayWidget
    
    - name: Run unit tests
      run: |
        cd "Poem of the Day"
        bazelisk test --config=ci //PoemOfTheDayTests:PoemOfTheDayTests
    
    # - name: Run UI tests
    #   run: |
    #     cd "Poem of the Day"
    #     bazelisk test --config=ci //PoemOfTheDayUITests:PoemOfTheDayUITests
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          bazel-testlogs/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: |
          bazel-bin/PoemOfTheDay.ipa

  release:
    name: Build and Upload Release
    needs: build-and-test
    runs-on: macos-26  # macOS 26 with Xcode 26 for FoundationModels support
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Bazelisk
      run: |
        brew install bazelisk
        bazelisk version

    - name: Setup App Store Connect CLI
      uses: rudrankriyam/setup-asc@v1
      with:
        version: latest

    - name: Verify App Store Connect credentials
      run: |
        source scripts/asc-env.sh
        asc auth status --validate --output json

    - name: Setup iOS signing
      uses: ./.github/actions/ios-signing
      with:
        certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.P12_PASSWORD }}
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
        provision-profile-base64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        widget-provision-profile-base64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}

    - name: Resolve next build number
      id: build_number
      run: |
        source scripts/asc-env.sh
        APP_VERSION=$(python3 -c "import re,pathlib;print(re.search(r'--define=app_version=(\S+)', pathlib.Path('.bazelrc').read_text()).group(1))")
        NEXT=$(asc builds next-build-number \
          --app "$ASC_APP_ID" \
          --version "$APP_VERSION" \
          --platform IOS \
          --initial-build-number 1 \
          --output json | python3 -c "import json,sys;print(json.load(sys.stdin)['nextBuildNumber'])")
        echo "Marketing version $APP_VERSION, next build number $NEXT"
        echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
        echo "build_number=$NEXT" >> "$GITHUB_OUTPUT"

    - name: Build Release IPA
      run: |
        # Build with the 'release' config defined in .bazelrc, stamping the
        # build number resolved from App Store Connect.
        cd "Poem of the Day"
        bazelisk build --config=release \
          --define=app_version="${{ steps.build_number.outputs.app_version }}" \
          --define=build_number="${{ steps.build_number.outputs.build_number }}" \
          //:PoemOfTheDay

    - name: Upload to TestFlight
      env:
        TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
      run: |
        source scripts/asc-env.sh

        # Bazel writes its convenience symlinks at the workspace root, so the
        # IPA lands in ./bazel-bin regardless of where the build step ran.
        IPA_PATH=$(bazelisk cquery --config=release --output=files //:PoemOfTheDay 2>/dev/null | grep '\.ipa$' | head -1)
        if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
          IPA_PATH="bazel-bin/PoemOfTheDay.ipa"
        fi
        if [ ! -f "$IPA_PATH" ]; then
          echo "Error: IPA not found at $IPA_PATH"
          find . -name "*.ipa"
          exit 1
        fi

        echo "Uploading $IPA_PATH to App Store Connect..."
        if [ -n "$TESTFLIGHT_GROUP" ]; then
          # Upload, wait for processing, and hand the build to the beta group.
          asc publish testflight \
            --app "$ASC_APP_ID" \
            --ipa "$IPA_PATH" \
            --group "$TESTFLIGHT_GROUP" \
            --wait \
            --poll-interval 15s \
            --output json
        else
          # No beta group configured: upload and wait for processing only.
          asc builds upload \
            --app "$ASC_APP_ID" \
            --ipa "$IPA_PATH" \
            --wait \
            --poll-interval 15s \
            --output json
        fi

    - name: Release status summary
      if: always()
      run: |
        source scripts/asc-env.sh
        asc status --app "$ASC_APP_ID" --output markdown >> "$GITHUB_STEP_SUMMARY" || true

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
