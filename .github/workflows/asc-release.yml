name: App Store Release

# Manual App Store submission. Builds a signed release IPA, syncs metadata,
# runs the readiness report, then hands everything to `asc publish appstore`.
# Submission only happens when the `submit` input is explicitly checked, so a
# mis-click stages the version rather than shipping it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to release (defaults to app_version in .bazelrc)'
        required: false
        type: string
      submit:
        description: 'Submit for App Store review (unchecked = attach build and validate only)'
        required: false
        default: false
        type: boolean
      screenshots:
        description: 'Upload screenshots from AppStoreScreenshots/ before publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: asc-release
  cancel-in-progress: false

env:
  APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
  APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
  APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID }}

jobs:
  release:
    name: Publish App Store version
    runs-on: macos-26  # macOS 26 with Xcode 26 for FoundationModels support
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          brew install bazelisk
          bazelisk version

      - name: Setup App Store Connect CLI
        uses: rudrankriyam/setup-asc@v1
        with:
          version: latest

      - name: Verify App Store Connect credentials
        run: |
          source scripts/asc-env.sh
          asc auth status --validate --output json

      # No credentials needed; catches over-length copy before anything is built.
      - name: Validate metadata files
        run: asc metadata validate --dir ./metadata --output table

      - name: Resolve version and build number
        id: version
        run: |
          source scripts/asc-env.sh
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(python3 -c "import re,pathlib;print(re.search(r'--define=app_version=(\S+)', pathlib.Path('.bazelrc').read_text()).group(1))")
          fi
          NEXT=$(asc builds next-build-number \
            --app "$ASC_APP_ID" \
            --version "$VERSION" \
            --platform IOS \
            --initial-build-number 1 \
            --output json | python3 -c "import json,sys;print(json.load(sys.stdin)['nextBuildNumber'])")
          echo "Releasing version $VERSION, build $NEXT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Setup iOS signing
        uses: ./.github/actions/ios-signing
        with:
          certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          provision-profile-base64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          widget-provision-profile-base64: ${{ secrets.BUILD_WIDGET_PROVISION_PROFILE_BASE64 }}

      - name: Build Release IPA
        run: |
          bazelisk build --config=release \
            --define=app_version="${{ steps.version.outputs.version }}" \
            --define=build_number="${{ steps.version.outputs.build_number }}" \
            //:PoemOfTheDay

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(bazelisk cquery --config=release --output=files //:PoemOfTheDay 2>/dev/null | grep '\.ipa$' | head -1)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            IPA_PATH="bazel-bin/PoemOfTheDay.ipa"
          fi
          if [ ! -f "$IPA_PATH" ]; then
            echo "Error: IPA not found at $IPA_PATH" >&2
            find . -name "*.ipa" >&2
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots
        if: inputs.screenshots
        run: |
          source scripts/asc-env.sh
          # 1242x2688 -> IPHONE_65, 1206x2622 -> IPHONE_61
          asc screenshots upload \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --path ./AppStoreScreenshots/iPhone_6.5 \
            --device-type IPHONE_65 \
            --max-screenshots 10 \
            --replace \
            --output json
          asc screenshots upload \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --path ./AppStoreScreenshots/iPhone_6.3 \
            --device-type IPHONE_61 \
            --max-screenshots 10 \
            --replace \
            --output json

      # Preview the exact mutation sequence before anything is changed.
      - name: Preview publish plan
        run: |
          source scripts/asc-env.sh
          asc publish appstore \
            --app "$ASC_APP_ID" \
            --ipa "${{ steps.ipa.outputs.path }}" \
            --version "${{ steps.version.outputs.version }}" \
            --metadata-dir ./metadata \
            --dry-run \
            --output markdown | tee -a "$GITHUB_STEP_SUMMARY"

      # Uploads the build, waits for processing, applies metadata, attaches the
      # build to the version, and submits only when `submit` was checked.
      - name: Publish App Store version
        run: |
          source scripts/asc-env.sh
          SUBMIT_FLAGS=""
          if [ "${{ inputs.submit }}" = "true" ]; then
            SUBMIT_FLAGS="--submit --confirm"
          fi
          asc publish appstore \
            --app "$ASC_APP_ID" \
            --ipa "${{ steps.ipa.outputs.path }}" \
            --version "${{ steps.version.outputs.version }}" \
            --metadata-dir ./metadata \
            --wait \
            --poll-interval 30s \
            --timeout 60m \
            $SUBMIT_FLAGS \
            --output json

      - name: Submission readiness report
        if: always()
        run: |
          source scripts/asc-env.sh
          asc validate \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.version }}" \
            --output markdown >> "$GITHUB_STEP_SUMMARY" || true
          asc status --app "$ASC_APP_ID" --output markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
